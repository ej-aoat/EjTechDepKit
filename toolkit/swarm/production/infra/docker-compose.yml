version: "3"
services:
  eastjcojp:
    image: ghcr.io/ej-aoat/ejtech/ejtech-nginx:latest
    build:
      context: ../../../../subsystem/nginx
      dockerfile: ./Dockerfile
    ports:
      - "8080:80"
    volumes:
      # nginx.conは、このワークスペースにある/app/www/nginx.confを下記の場所に配置してください。
      - /opt/ejtech/infra/nginx.conf:/etc/nginx/nginx.conf
      - /opt/ejtech/infra/EjWeb/www/:/usr/share/nginx/html/
    environment:
      VIRTUAL_HOST: www.eastj.co.jp
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: www.eastj.co.jp
      LETSENCRYPT_EMAIL: aoki.atsushi.5@eastj.co.jp
      LETSENCRYPT_TEST: "false"
    networks:
      - ssl_proxy
    restart: always
networks:
  ssl_proxy:
    external: true
