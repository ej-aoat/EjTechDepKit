services:
  nginx-proxy:
    image: ghcr.io/ej-aoat/nijigapf/nginx-proxy-cus:1.0.1
    container_name: nginx-proxy
    privileged: true
    ports:
      - 80:80
      - 443:443
    volumes:
      - /opt/ejtech/proxy/certs:/etc/nginx/certs:ro
      - /opt/ejtech/proxy/htpasswd:/etc/nginx/htpasswd
      - /etc/nginx/vhost.d
      - /usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /opt/ejtech/proxy/log:/var/log/nginx
    networks:
      - ssl_proxy
    restart: always
  letsencrypt-nginx:
    image: nginxproxy/acme-companion
    container_name: letsencrypt-nginx
    privileged: true
    environment:
      ACME_HTTP_CHALLENGE_LOCATION: "true"
    volumes:
      - /opt/ejtech/proxy/certs:/etc/nginx/certs:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    volumes_from:
      - nginx-proxy
    networks:
      - ssl_proxy
    restart: always
networks:
  ssl_proxy:
    external: true
